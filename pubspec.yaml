name: drive_master_app
description: A DriveMaster Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get_it: ^7.6.7
  qr_code_scanner_plus: ^2.0.12  # Better QR scanner package
  permission_handler: ^11.3.1  # Updated to compatible version
  http: ^1.1.0  # For API calls
  shared_preferences: ^2.2.2  # For token storage
  sqflite: ^2.3.0  # SQLite database for trip persistence
  path: ^1.8.3  # For database path management
  flutter_foreground_task: ^6.0.0+1  # For background trip tracking
  geolocator: ^9.0.2  # For precise location tracking
  stomp_dart_client: ^1.0.2  # STOMP client for RabbitMQ
  mqtt_client: ^10.0.0  # MQTT client for live tracking (web-mqtt port 15676)
  url_launcher: ^6.2.5  # For opening WhatsApp / Google Maps links
  flutter_map: ^6.1.0  # OpenStreetMap-based map widget
  latlong2: ^0.9.1  # LatLng coordinate type for flutter_map

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0F1923"
  adaptive_icon_foreground: "assets/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/